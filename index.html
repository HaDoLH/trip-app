<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<title>旅程 Trip</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <!-- 上方標題列 -->
  <header class="bar">
    <button class="icon-btn" id="btnBack" hidden aria-label="回到旅程列表">‹</button>
    <h1 id="barTitle">我的旅程</h1>
    <button class="icon-btn" id="btnMenu" aria-label="設定與說明">☰</button>
  </header>

  <!-- ① 旅程列表 -->
  <main class="screen" id="scTrips">
    <div class="trips" id="tripList"></div>
  </main>

  <!-- ② 某一趟旅程的行程 -->
  <main class="screen" id="scPlan" hidden>
    <div class="daytabs" id="dayTabs" role="tablist"></div>
    <div id="dayView"></div>
  </main>

  <!-- ③ 新增（對話式） -->
  <main class="screen" id="scAdd" hidden>
    <div class="chat" id="chatList"></div>
  </main>

  <!-- 輸入區（只在「新增」分頁出現） -->
  <div class="composer" id="composer" hidden>
    <div class="chips" id="chips"></div>
    <div class="input-row">
      <textarea id="msgInput" rows="1" placeholder="貼上店名、地址、營業時間…可以一次貼好幾家"></textarea>
      <button class="send" id="btnSend" aria-label="解析">➤</button>
    </div>
  </div>

  <!-- 底部分頁列（只在進入某趟旅程後出現） -->
  <nav class="tabs" id="tabBar" role="tablist" hidden>
    <button class="tab" id="tabPlan" role="tab" aria-selected="true"><span class="ico">▤</span>行程</button>
    <button class="tab" id="tabAdd" role="tab" aria-selected="false"><span class="ico">＋</span>新增</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="js/sample-data.js"></script>
<script src="js/store.js"></script>
<script src="js/parser.js"></script>
<script src="js/app.js"></script>
</body>
</html>
